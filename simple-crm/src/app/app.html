<mat-drawer-container class="app-shell" autosize>
  <mat-drawer
    #drawer
    class="app-sidenav"
    mode="side"
    (openedChange)="onDrawerOpenedChange($event)"
  >
    <div class="sidenav-logo">
      <img src="img/logo-crm.svg" alt="Simple CRM logo" />
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>fact_check</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/user" routerLinkActive="active-link">
        <mat-icon matListItemIcon>face</mat-icon>
        <span matListItemTitle>User</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content class="app-content">
    <mat-toolbar>
      <button
        matIconButton
        class="example-icon"
        aria-label="Toggle sidenav"
        (click)="drawer.toggle()"
      >
        <mat-icon svgIcon="menu-icon"></mat-icon>
      </button>
      <span>Simple CRM</span>
      <span class="example-spacer"></span>
      <button
        matIconButton
        class="example-icon favorite-icon"
        aria-label="Favorite"
      >
        <mat-icon>favorite</mat-icon>
      </button>
      <button matIconButton class="example-icon" aria-label="Share">
        <mat-icon>share</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-main">
      <div class="users-table-card">
        <table mat-table [dataSource]="users()" class="users-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let user">{{ userName(user) }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email || '—' }}</td>
          </ng-container>

          <ng-container matColumnDef="city">
            <th mat-header-cell *matHeaderCellDef>City</th>
            <td mat-cell *matCellDef="let user">{{ user.city || '—' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <tr class="mat-row no-data-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              No users created yet.
            </td>
          </tr>
        </table>
      </div>

      @if (drawer.opened) {
        <router-outlet />
      }
    </main>

    <button matFab class="fab-add" aria-label="Add user" (click)="openUserDialog()">
      <mat-icon svgIcon="add-user"></mat-icon>
    </button>
  </mat-drawer-content>
</mat-drawer-container>
