<mat-drawer-container class="app-shell" autosize>
  <mat-drawer
    #drawer
    class="app-sidenav"
    mode="side"
    (openedChange)="onDrawerOpenedChange($event)"
  >
    <div class="sidenav-logo" aria-hidden="true">Logo</div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>fact_check</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/user" routerLinkActive="active-link">
        <mat-icon matListItemIcon>face</mat-icon>
        <span matListItemTitle>User</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content class="app-content">
    <mat-toolbar>
      <button
        matIconButton
        class="example-icon"
        aria-label="Toggle sidenav"
        (click)="drawer.toggle()"
      >
        <mat-icon svgIcon="menu-icon"></mat-icon>
      </button>
      <span>Simple CRM</span>
      <span class="example-spacer"></span>
      <button
        matIconButton
        class="example-icon favorite-icon"
        aria-label="Example icon-button with heart icon"
      >
        <mat-icon>favorite</mat-icon>
      </button>
      <button matIconButton class="example-icon" aria-label="Example icon-button with share icon">
        <mat-icon>share</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-main">
      @if (drawer.opened) {
        <router-outlet />
      }
    </main>

    <button matFab class="fab-add" aria-label="Hinzufügen" (click)="openUserDialog()">
      <mat-icon svgIcon="add-user"></mat-icon>
    </button>
  </mat-drawer-content>
</mat-drawer-container>
